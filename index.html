
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #d8f3dc, #b7e4c7);
    }

    .container {
      position: relative;
      z-index: 1;
    }

    /* Decorative background icon */
    .bg-decor {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 250px;
      opacity: 0.08;
      z-index: 0;
    }

    .choice-icon { font-size: 2rem; }
    .vs-text { font-size: 1.5rem; font-weight: bold; }
    .btn { border-radius: 30px; }

    .winner {
      background-color: #d4edda;
      border-radius: 10px;
      padding: 15px;
    }

    .loser {
      background-color: #f8d7da;
      border-radius: 10px;
      padding: 15px;
    }

    .pop {
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<!-- Decorative image -->
<img src="https://cdn-icons-png.flaticon.com/512/616/616494.png" class="bg-decor" alt="decor">

<div class="container text-center mt-5">
  <h1 class="mb-4 fw-bold">🎮 Rock Paper Scissors</h1>

  <div class="d-flex justify-content-center align-items-center gap-5 mb-4 flex-wrap">
    
    <div id="playerBox">
      <h5>👤 Player</h5>
      <div id="playerChoice" class="choice-icon">-</div>
      <p>Score: <span id="playerScore">0</span></p>
    </div>

    <div class="vs-text">VS</div>

    <div id="computerBox">
      <h5>🤖 Computer</h5>
      <div id="computerChoice" class="choice-icon">-</div>
      <p>Score: <span id="computerScore">0</span></p>
    </div>

  </div>

  <h4 id="result" class="mb-4 text-primary">Make your move!</h4>

  <div class="d-flex flex-column align-items-center gap-3">
    <button class="btn btn-primary mb-2 w-50 py-3 " onclick="playGame('rock')">🪨 Rock</button>
    <button class="btn btn-success mb-2 w-50 py-3 " onclick="playGame('paper')">📄 Paper</button>
    <button class="btn btn-danger mb-2 w-50 py-3 " onclick="playGame('scissors')">✂️ Scissors</button>
  </div>

  <button class="btn btn-dark mt-4 w-25 mb-2 py-3" onclick="resetGame()">🔄 Reset Game</button>
</div>

<script src="scratch.js"></script>

</body>
</html>
