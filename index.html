<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url('https://img.freepik.com/premium-vector/hands-playing-rock-paper-scissors-game-flat-design-style-vector-illustration_540284-598.jpg?semt=ais_hybrid&w=740&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .overlay {
      background: rgba(0,0,0,0.5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    </style>
</head>
<body class="bg-success">

 <h1 class="text-center bg-dark text-white p-3 m-0 w-100"
    style="position: sticky; top: 0; z-index: 1000;">
  Rock Paper Scissors
</h1>
 <div class="card shadow-lg p-4 game d-flex flex-column align-items-center mt-5 pt-5 bg-dark mx-auto "
     style="max-width: 500px; width: 100%;">

    <div id="result" class="fw-bold mt-4 text-white" style="font-size:30px;">
      Choose your move!
    </div>

    <div id="score" class="mt-3 text-white" style="font-size:25px; ">
     👤 You: 0 | 🤖Computer: 0
    </div>

    <div class="d-flex flex-column align-items-center gap-4 w-100 mt-3">
      <button class="btn btn-light  w-50 py-3" onclick="playGame('rock')">Rock👊</button>
      <button class="btn btn-light  w-50 py-3" onclick="playGame('paper')">Paper📒</button>
      <button class="btn btn-light  w-50 py-3" onclick="playGame('scissors')">Scissors✂️</button>
    </div>
     <button class="btn btn-light mt-4 w-50 mb-2 py-3" onclick="resetGame()">🔄 Reset Game</button>

  </div>
    
</body>
</html>
